services:
  - type: web
    name: deeptravel-agent-api
    runtime: python
    plan: free
    buildCommand: bash ./render-build.sh
    startCommand: bash ./render-start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: TEST_MODE
        value: false
      - key: MOCK_LLM
        value: false
      - key: MOCK_AMAP
        value: false
      - key: MOCK_SEARCH
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: deeptravel-postgres
          property: connectionString
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: 15
      - key: EMBEDDING_PROVIDER
        value: local_hash
      - key: EMBEDDING_MODEL
        value: render-local-hash
      - key: EMBEDDING_DIMENSIONS
        value: 1024
      - key: WEB_FETCH_RENDERER
        value: static
      - key: SEARCH_MCP_ENDPOINT
        value: http://127.0.0.1:8100/mcp
      - key: SEARCH_MCP_INTERNAL_API_KEY
        generateValue: true
      - key: RAILWAY_MCP_ENDPOINT
        value: http://127.0.0.1:8200/mcp
      - key: RAILWAY_RESULT_LIMIT
        value: 9
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_CHAT_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_REASONING_MODEL
        value: deepseek-reasoner
      - key: AMAP_PROVIDER
        value: mcp
      - key: AMAP_MCP_ENDPOINT
        value: https://mcp.amap.com/mcp
      - key: AGENT_OPTIONAL_ENRICHMENT_TIMEOUT_SECONDS
        value: 12
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AMAP_MCP_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false

databases:
  - name: deeptravel-postgres
    plan: free
    databaseName: deeptravel
    user: deeptravel
